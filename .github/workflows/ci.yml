name: Continuous Integration (CI)

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Branch Merge Flow Policy Check
  # ---------------------------------------------------------------------------
  branch-policy:
    name: Verify Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate Pull Request Branch Hierarchy
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking PR branch targets..."
          echo "Base Ref: ${{ github.base_ref }}"
          echo "Head Ref: ${{ github.head_ref }}"
          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error title=Branch Policy Violation::Direct PRs to 'main' are only allowed from 'dev'. Received: ${{ github.head_ref }}"
            exit 1
          fi
          echo "Branch policy check passed successfully."

  # ---------------------------------------------------------------------------
  # 2. Client CI (Next.js & TypeScript)
  # ---------------------------------------------------------------------------
  client-ci:
    name: Client Checks (Typecheck & Build)
    runs-on: ubuntu-latest
    needs: [branch-policy]
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://smartprep-ai-server.onrender.com/api' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '185382203123-m8smuke9b9qaeeu2pgmhdf9nvuckt95r.apps.googleusercontent.com' }}

  # ---------------------------------------------------------------------------
  # 3. Server CI (FastAPI, Python, Lint & Tests)
  # ---------------------------------------------------------------------------
  server-ci:
    name: Server Checks (Lint & Test)
    runs-on: ubuntu-latest
    needs: [branch-policy]
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install OS Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            tesseract-ocr \
            poppler-utils \
            ffmpeg \
            libglib2.0-0

      - name: Upgrade Pip & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest httpx

      - name: Validate Python Bytecode Compilation
        run: python -m compileall .

      - name: Lint Code (Syntax and Fatal Errors)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Unit Tests
        run: pytest tests/ -v
        env:
          ENV: test
          DB_NAME: smartprep-ai-test
          JWT_SECRET: test-secret-key-32-chars-long-dummy
          ALLOWED_ORIGINS: "*"
          GOOGLE_API_KEY: "dummy-test-key-for-ci"

  # ---------------------------------------------------------------------------
  # 4. Docker & Compose Configuration Check
  # ---------------------------------------------------------------------------
  docker-ci:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    needs: [branch-policy]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          touch ./server/.env ./client/.env
          docker compose config --quiet
          echo "docker-compose.yml configuration is valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Server Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: smartprep-server:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
