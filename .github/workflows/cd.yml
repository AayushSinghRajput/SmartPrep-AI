name: Continuous Deployment (CD)

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - production

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Deploy to Dev / Staging Environment (Triggered on 'dev' branch push)
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev / Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'dev')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Render Dev Deployment (Backend)
        run: |
          if [ -n "${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render Dev deploy hook..."
            curl -s -f -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}"
            echo "Render Dev deploy hook triggered successfully."
          else
            echo "RENDER_DEV_DEPLOY_HOOK_URL secret not configured. Skipping Render Dev deploy webhook."
          fi

      - name: Trigger Vercel Dev Deployment (Frontend)
        run: |
          if [ -n "${{ secrets.VERCEL_DEV_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Vercel Dev deploy hook..."
            curl -s -f -X POST "${{ secrets.VERCEL_DEV_DEPLOY_HOOK_URL }}"
            echo "Vercel Dev deploy hook triggered successfully."
          else
            echo "VERCEL_DEV_DEPLOY_HOOK_URL secret not configured. Vercel automatically deploys preview/branch deployments if GitHub integration is active."
          fi

      - name: Dev Deployment Summary
        run: |
          echo "### 🚀 Development Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Deploy to Production Environment (Triggered on 'main' branch push)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Render Production Deployment (Backend)
        run: |
          if [ -n "${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render Production deploy hook..."
            curl -s -f -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}"
            echo "Render Production deploy hook triggered successfully."
          else
            echo "RENDER_PROD_DEPLOY_HOOK_URL secret not configured. (Render can also automatically deploy on push to main if auto-deploy is enabled)."
          fi

      - name: Trigger Vercel Production Deployment (Frontend)
        run: |
          if [ -n "${{ secrets.VERCEL_PROD_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Vercel Production deploy hook..."
            curl -s -f -X POST "${{ secrets.VERCEL_PROD_DEPLOY_HOOK_URL }}"
            echo "Vercel Production deploy hook triggered successfully."
          else
            echo "VERCEL_PROD_DEPLOY_HOOK_URL secret not configured. (Vercel automatically deploys production on push to main if connected to this repository)."
          fi

      - name: Production Deployment Summary
        run: |
          echo "### 🌟 Production Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
