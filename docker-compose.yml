services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017
      PORT: 8000
    volumes:
      - ./server/ml_model:/app/ml_model:ro
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  client:
    build: ./client
    restart: unless-stopped
    env_file:
      - ./client/.env
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo_data:
