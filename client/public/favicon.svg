    <!-- Bottom Right Wing (Lower S) -->
    <path
      d="M 256 384
         C 312 384 368 350 376 294
         C 384 238 326 204 268 196
         L 240 234
         C 286 242 328 262 324 292
         C 320 322 286 340 256 340
         Z"
      fill="url(#favLower)"
    />

    <!-- Forward Ascension Wing -->
    <path
      d="M 256 172
         L 366 120
         C 378 114 392 124 390 138
         L 374 238
         C 372 250 360 258 348 252
         L 256 210
         Z"
      fill="url(#favWingR)"
    />

    <!-- Golden Academic Ribbon -->
    <path
      d="M 174 294
         L 256 332
         L 338 294
         C 346 290 354 298 350 306
         L 264 394
         C 260 398 252 398 248 394
         L 162 306
         C 158 298 166 290 174 294
         Z"
      fill="url(#favGold)"
    />

    <!-- AI Sparkle Star -->
    <g transform="translate(256, 256)">
      <path
        d="M 0 -40
           C 0 -12 12 0 40 0
           C 12 0 0 12 0 40
           C 0 12 -12 0 -40 0
           C -12 0 0 -12 0 -40
           Z"
        fill="#ffffff"
      />
      <circle cx="0" cy="0" r="8" fill="#67e8f9" />
