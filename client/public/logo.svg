<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Subtle Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Wing Left Gradient (Indigo/Violet) -->
    <linearGradient id="wingLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Wing Right Gradient (Cyan/Sky) -->
    <linearGradient id="wingRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Base Ribbon Gradient (Electric Amber / Gold) -->
    <linearGradient id="amberRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Lower Loop Gradient (Royal Purple / Indigo) -->
    <linearGradient id="lowerLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="60%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Radial Ambient Inner Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4338ca" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Elements -->
    <filter id="markShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Jewel Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />
  
  <!-- Ambient Inner Highlight Glow -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#ambientGlow)" />

  <!-- Core Mark: Ascending S-P Knowledge Nexus -->
  <g filter="url(#markShadow)">
    
    <!-- Top Left Wing / Open Book Page (Upper loop of S) -->
    <path
      d="M 256 128
         C 200 128 144 162 136 218
         C 128 274 186 308 244 316
         L 272 278
         C 226 270 184 250 188 220
         C 192 190 226 172 256 172
         Z"
      fill="url(#wingLeftGrad)"
    />

    <!-- Bottom Right Base / Foundation Shelf (Lower loop of S) -->
    <path
      d="M 256 384
         C 312 384 368 350 376 294
         C 384 238 326 204 268 196
         L 240 234
         C 286 242 328 262 324 292
         C 320 322 286 340 256 340
         Z"
      fill="url(#lowerLoopGrad)"
    />

    <!-- Ascension Forward Vector / Right Wing (Knowledge Flight) -->
    <path
      d="M 256 172
         L 366 120
         C 378 114 392 124 390 138
         L 374 238
         C 372 250 360 258 348 252
         L 256 210
         Z"
      fill="url(#wingRightGrad)"
      opacity="0.95"
    />

    <!-- Golden Milestone Crest / Academic Honor Ribbon -->
    <path
      d="M 174 294
         L 256 332
         L 338 294
         C 346 290 354 298 350 306
         L 264 394
         C 260 398 252 398 248 394
         L 162 306
         C 158 298 166 290 174 294
         Z"
      fill="url(#amberRibbonGrad)"
    />

    <!-- Center AI Sparkle Star (Intelligence Beacon) -->
    <g transform="translate(256, 256)" filter="url(#sparkleGlow)">
      <!-- 4-point Diamond Star -->
      <path
        d="M 0 -36
           C 0 -10 10 0 36 0
           C 10 0 0 10 0 36
           C 0 10 -10 0 -36 0
           C -10 0 0 -10 0 -36
           Z"
        fill="#ffffff"
      />
      <!-- Inner Radiant Core -->
      <circle cx="0" cy="0" r="7" fill="#67e8f9" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>

    <!-- Micro Orbit Node (Physics / Science Precision) -->
    <circle cx="388" cy="126" r="6" fill="#38bdf8" />
    <circle cx="128" cy="220" r="4.5" fill="#a5b4fc" />
  </g>
</svg>

